name: voiceguard
description: "AI-Powered Real-Time Detection and Prevention of Voice Cloning Impersonation Attacks"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter  
  flutter_launcher_icons: ^0.14.4
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # UI / fonts / icons
  google_fonts: ^6.2.1

  # Utility
  intl: ^0.19.0

  # Biometric login (Face ID / fingerprint)
  local_auth: ^2.3.0

  # Detects real incoming/active calls + caller number (Android only for number)
  phone_state: ^3.0.0

  # Runtime permission prompts (READ_PHONE_STATE, etc.)
  permission_handler: 13.0.0

  # Slideable actions
  flutter_slidable: ^4.0.3

  #Storing recordings and other data locally
  hive_flutter: ^1.1.0
  record: ^6.2.1

  vad: ^0.0.8

  shared_preferences: ^2.5.5
  web: 1.1.1
  web_socket_channel: ^3.0.3
  file_picker: ^11.0.3
  ffmpeg_kit_flutter_new: 4.6.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/appIcon.png"
  min_sdk_android: 21

dependency_overrides:
  permission_handler: 13.0.0
  permission_handler_android: 13.0.0